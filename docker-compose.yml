version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stellarreach-db
    environment:
      POSTGRES_USER: stellarreach
      POSTGRES_PASSWORD: stellarreach_dev
      POSTGRES_DB: stellarreach_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stellarreach"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
